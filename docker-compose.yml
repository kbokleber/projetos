# Compose: app + Postgres (dev local e Coolify Docker Compose).
#
# Coolify: Build Pack = Docker Compose, arquivo = docker-compose.yml
# DATABASE_URL (opção B):
#   postgresql://projetos:projetos@postgres:5432/sistema_projetos
#
# Uso local:
#   docker compose up --build
#   http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projetos
      POSTGRES_PASSWORD: projetos
      POSTGRES_DB: sistema_projetos
    # Sem ports no host — evita conflito com outro Postgres na VPS.
    # Rede interna: postgres:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetos -d sistema_projetos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://projetos:projetos@postgres:5432/sistema_projetos}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET é obrigatório}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL é obrigatório}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
    ports:
      - "3000:3000"
    networks:
      - app-network

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
