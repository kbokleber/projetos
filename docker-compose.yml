# App + Postgres no mesmo stack (Coolify Docker Compose).
#
# Coolify:
#   - Build Pack: Docker Compose
#   - Serviço do domínio: app
#   - Porta do domínio: 3000
#
# Variáveis:
#   DATABASE_URL=postgresql://projetos:projetos@postgres:5432/sistema_projetos
#   AUTH_SECRET=...
#   NEXTAUTH_URL=https://projetos.kbosolucoes.com.br
#   API_ALLOWED_ORIGINS=https://projetos.kbosolucoes.com.br
#
# Dev local (Next no host acessando Postgres):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up postgres -d

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projetos
      POSTGRES_PASSWORD: projetos
      POSTGRES_DB: sistema_projetos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # NÃO publique 5432 no host em produção — conflita com outros Postgres na VPS.
    # O app acessa via rede interna: postgres:5432
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetos -d sistema_projetos"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      default:
        aliases:
          - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://projetos:projetos@postgres:5432/sistema_projetos}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-coolify-use-openssl-rand}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000}
    # Só expose — o Coolify/Traefik faz o proxy. NÃO publique 3000 no host.
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - default

volumes:
  postgres-data:
