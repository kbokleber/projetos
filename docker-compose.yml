# Compose: app + Postgres (dev local e Coolify Docker Compose).
#
# Coolify: Build Pack = Docker Compose
# - Serviço público: app
# - Porta: 3000
# DATABASE_URL:
#   postgresql://projetos:projetos@postgres:5432/sistema_projetos
#
# NEXTAUTH_URL / API_ALLOWED_ORIGINS:
#   https://projetos.kbosolucoes.com.br

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: projetos
      POSTGRES_PASSWORD: projetos
      POSTGRES_DB: sistema_projetos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetos -d sistema_projetos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: ${DATABASE_URL:-postgresql://projetos:projetos@postgres:5432/sistema_projetos}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET é obrigatório}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL é obrigatório}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-}
    # Coolify conecta via proxy na porta do container.
    # Não fixe rede customizada — o Coolify precisa anexar a rede dele.
    expose:
      - "3000"
    ports:
      - "3000:3000"

volumes:
  postgres-data:
