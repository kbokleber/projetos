# App (Coolify Docker Compose). O Postgres NÃO fica neste stack: usa o banco
# separado do Coolify (projeto "Sistema de Projetos" > sistema-projetos-prod-db).
#
# Coolify:
#   - Build Pack: Docker Compose
#   - Serviço do domínio: app
#   - Porta do domínio: 3000
#
# Variáveis:
#   DATABASE_URL=<Postgres URL (internal) do sistema-projetos-prod-db>
#   AUTH_SECRET=...
#   NEXTAUTH_URL=https://projetos.kbosolucoes.com.br
#   API_ALLOWED_ORIGINS=https://projetos.kbosolucoes.com.br
#
# Dev local (Next no host acessando Postgres):
#   docker compose -f docker-compose.local.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Postgres separado no Coolify (recurso "sistema-projetos-prod-db"), com backup no R2.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-coolify-use-openssl-rand}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-/app/uploads}
    volumes:
      - uploads-data:/app/uploads
    # Só expose — o Coolify/Traefik faz o proxy. NÃO publique 3000 no host.
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - default

volumes:
  uploads-data:
