# App + Postgres no mesmo stack (um único recurso no Coolify).
#
# Coolify:
#   1. Crie um Project (ex.: "Projetos")
#   2. New Resource → Docker Compose (neste project)
#   3. Arquivo: docker-compose.yml
#   4. Serviço público: app · Porta: 3000
#   5. Environment Variables (abaixo)
#
# Variáveis no Coolify:
#   AUTH_SECRET=...
#   NEXTAUTH_URL=https://projetos.kbosolucoes.com.br
#   API_ALLOWED_ORIGINS=https://projetos.kbosolucoes.com.br
#   DATABASE_URL=postgresql://projetos:projetos@postgres:5432/sistema_projetos
#
# Local:
#   docker compose up --build

services:
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: projetos
      POSTGRES_PASSWORD: projetos
      POSTGRES_DB: sistema_projetos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetos -d sistema_projetos"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    # Garante o alias DNS "postgres" na rede do compose
    networks:
      default:
        aliases:
          - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Host = nome do serviço (mesma rede do compose)
      DATABASE_URL: ${DATABASE_URL:-postgresql://projetos:projetos@postgres:5432/sistema_projetos}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-coolify-use-openssl-rand}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      API_ALLOWED_ORIGINS: ${API_ALLOWED_ORIGINS:-http://localhost:3000}
    # Coolify faz o proxy; expose basta para o roteamento interno
    expose:
      - "3000"
    # Útil só em dev local (comente no Coolify se a porta 3000 do host conflitar)
    ports:
      - "3000:3000"
    networks:
      - default

volumes:
  postgres-data:
